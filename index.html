<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ultimate Melon Sandbox - Fire Update</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        h3 { margin: 8px 0 2px 0; color: #ff3333; font-size: 1.1rem; text-shadow: 0 0 5px #000; }
        #controls {
            margin-bottom: 5px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            padding: 0 5px;
        }
        button {
            background-color: #222;
            color: white;
            border: 2px solid #444;
            padding: 8px 12px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            font-size: 0.8rem;
        }
        button:active { background-color: #555; }
        .btn-weapon { background-color: #522; border-color: #733; }
        .btn-weapon:active { background-color: #833; }
        .btn-fire { background-color: #531; border-color: #741; }
        .btn-fire:active { background-color: #851; }
        canvas {
            background-color: #222;
            border-top: 4px solid #333;
            border-bottom: 4px solid #333;
            width: 100%;
            height: 65vh;
        }
    </style>
</head>
<body>

    <h3>🔥 ULTIMATE MELON SANDBOX (FIRE UPDATE) 🔥</h3>
    <div id="controls">
        <button onclick="spawnRagdoll()">🧍 スポーーン</button>
        <button class="btn-weapon" onclick="toggleKnife()">🔪 ナイフON/OFF</button>
        <button class="btn-weapon" onclick="shootGun()">🔫 銃を発射！</button>
        <button class="btn-fire" onclick="shootFire()">🔥 火炎放射！</button>
        <button onclick="clearCanvas()">🧹 クリア</button>
    </div>
    <canvas id="sandbox"></canvas>

    <script>
        const canvas = document.getElementById('sandbox');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight * 0.65;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        // 物理演算の基本設定
        const GRAVITY = 0.4;
        const FRICTION = 0.98;
        const BOUNCE = 0.2;

        // ゲーム内のオブジェクトを管理する配列
        let points = [];
        let sticks = [];
        let particles = []; // 血・炎・煙はすべてここにブチ込む
        let bullets = [];
        let draggedPoint = null;

        // 武器の初期位置と設定
        let knife = { x: 120, y: 150, width: 80, height: 16, isDragged: false, active: true };
        let gun = { x: 40, y: 80, width: 70, height: 30 };
        let flamethrower = { x: 40, y: 180, width: 75, height: 25 }; // 火炎放射器

        // 🩸 血・🔥 炎・💨 煙のエフェクトクラス
        class EffectParticle {
            constructor(x, y, vx, vy, type = 'blood') {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.type = type; // 'blood', 'fire', 'smoke'
                this.radius = Math.random() * 4 + 1;
                this.life = type === 'smoke' ? Math.random() * 40 + 30 : Math.random() * 50 + 20;
                this.maxLife = this.life;
            }
            update() {
                if (this.type === 'blood') {
                    this.vx *= 0.98;
                    this.vy += 0.2; // 血は重力で落ちる
                    if (this.y > canvas.height) { this.y = canvas.height; this.vx = 0; this.vy = 0; }
                } else if (this.type === 'fire') {
                    this.vx *= 0.95;
                    this.vy -= 0.1; // 炎は少しずつ上に昇る
                } else if (this.type === 'smoke') {
                    this.vx *= 0.96;
                    this.vy -= 0.15; // 煙はふわふわ上に昇って広がる
                    this.radius += 0.1;
                }
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
            }
            draw() {
                let alpha = this.life / this.maxLife;
                if (this.type === 'blood') {
                    ctx.fillStyle = `rgba(200, 0, 0, ${alpha})`;
                } else if (this.type === 'fire') {
                    // 火の粉っぽくオレンジ〜赤に変化
                    let r = 255;
                    let g = Math.floor(100 + 155 * alpha);
                    ctx.fillStyle = `rgba(${r}, ${g}, 0, ${alpha})`;
                } else if (this.type === 'smoke') {
                    ctx.fillStyle = `rgba(100, 100, 100, ${alpha * 0.4})`;
                }
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 🔫 銃の弾丸クラス
        class Bullet {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = 16;
                this.vy = (Math.random() - 0.5) * 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
            }
            draw() {
                ctx.fillStyle = '#ffcc00';
                ctx.fillRect(this.x, this.y, 12, 3);
            }
        }

        // エフェクト発生関数
        function spawnEffect(x, y, count, type = 'blood') {
            for (let i = 0; i < count; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 5 + 1;
                if (type === 'fire') {
                    // 火炎放射は右方向へ勢いよく
                    angle = (Math.random() - 0.5) * 0.4;
                    speed = Math.random() * 8 + 4;
                }
                particles.push(new EffectParticle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, type));
            }
        }
        // 🧍 メロン人間の関節・パーツ（点）クラス
        class Point {
            constructor(x, y, radius = 9, type = 'body') {
                this.x = x;
                this.y = y;
                this.oldx = x;
                this.oldy = y;
                this.radius = radius;
                this.type = type; // 'head' または 'body'
                this.hp = 100;    // 耐久力（すぐ死なないように調整）
                this.burn = 0;    // 🔥 黒焦げ度（0：新鮮 〜 100：炭）
                this.onFire = false; // 現在炎上中かどうか
            }
            update() {
                let vx = (this.x - this.oldx) * FRICTION;
                let vy = (this.y - this.oldy) * FRICTION;
                this.oldx = this.x;
                this.oldy = this.y;
                this.x += vx;
                this.y += vy + GRAVITY;

                // 🔥 炎上中のリアルタイム処理
                if (this.onFire) {
                    this.hp -= 0.15; // じわじわダメージ
                    this.burn += 0.2; // じわじわ黒焦げに
                    if (this.burn > 100) this.burn = 100;
                    
                    // 燃えている間は常に火の粉と煙を噴き出す
                    if (Math.random() < 0.15) spawnEffect(this.x, this.y, 1, 'fire');
                    if (Math.random() < 0.2) spawnEffect(this.x, this.y, 1, 'smoke');
                }

                // 地面との衝突（落下ダメージを大幅にマイルドに修正！）
                if (this.y > canvas.height - this.radius) {
                    let speed = Math.abs(this.y - this.oldy);
                    this.y = canvas.height - this.radius;
                    this.oldy = this.y + vx * BOUNCE;
                    if (speed > 13) { // 相当激しく叩きつけた時だけ
                        this.hp -= speed * 0.4;
                        spawnEffect(this.x, this.y, 3, 'blood');
                    }
                }
                // 壁との衝突
                if (this.x > canvas.width - this.radius) { this.x = canvas.width - this.radius; this.oldx = this.x + vx * BOUNCE; }
                else if (this.x < this.radius) { this.x = this.radius; this.oldx = this.x + vx * BOUNCE; }

                if (this.hp < 0) this.hp = 0;
            }
        }

        // 🦴 パーツを繋ぐ骨（スティック）クラス
        class Stick {
            constructor(p0, p1, length) {
                this.p0 = p0;
                this.p1 = p1;
                this.length = length;
            }
            update() {
                let dx = this.p1.x - this.p0.x;
                let dy = this.p1.y - this.p0.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                let difference = this.length - distance;
                let percent = difference / distance / 2;
                this.p0.x -= dx * percent; this.p0.y -= dy * percent;
                this.p1.x += dx * percent; this.p1.y += dy * percent;
            }
        }

        // 🧍 メロン人間を安全な高さからスポーンさせる関数
        function spawnRagdoll() {
            let cx = Math.random() * (canvas.width - 200) + 100;
            let cy = 60; // 低めの空中から落とすことで即死を完全に防止！

            let head  = new Point(cx, cy, 16, 'head');
            let neck  = new Point(cx, cy + 25);
            let pelvis = new Point(cx, cy + 70);
            let r_shoulder = new Point(cx - 20, cy + 30); let r_hand = new Point(cx - 40, cy + 50);
            let l_shoulder = new Point(cx + 20, cy + 30); let l_hand = new Point(cx + 40, cy + 50);
            let r_knee = new Point(cx - 15, cy + 105); let r_foot = new Point(cx - 20, cy + 135);
            let l_knee = new Point(cx + 15, cy + 105); let l_foot = new Point(cx + 20, cy + 135);

            points.push(head, neck, pelvis, r_shoulder, r_hand, l_shoulder, l_hand, r_knee, r_foot, l_knee, l_foot);

            // 骨格のガチ繋がり設定
            sticks.push(new Stick(head, neck, 25), new Stick(neck, pelvis, 45));
            sticks.push(new Stick(neck, r_shoulder, 20), new Stick(r_shoulder, r_hand, 25));
            sticks.push(new Stick(neck, l_shoulder, 20), new Stick(l_shoulder, l_hand, 25));
            sticks.push(new Stick(pelvis, r_knee, 35), new Stick(r_knee, r_foot, 35));
            sticks.push(new Stick(pelvis, l_knee, 35), new Stick(l_knee, l_foot, 35));
        }
        // 🔪 ナイフのON/OFF切り替え
        function toggleKnife() { knife.active = !knife.active; }

        // 🔫 アサルトライフル連射処理
        function shootGun() {
            for(let i = 0; i < 5; i++) {
                setTimeout(() => {
                    bullets.push(new Bullet(gun.x + gun.width, gun.y + 10));
                    // 発砲時の硝煙（煙）エフェクト
                    spawnEffect(gun.x + gun.width, gun.y + 10, 1, 'smoke');
                }, i * 60); // タタタタタンと連射
            }
        }

        // 🔥 火炎放射器のぶっ放し処理
        function shootFire() {
            // 火炎放射器のノズルから一気に激しい炎を噴射！
            spawnEffect(flamethrower.x + flamethrower.width, flamethrower.y + 10, 12, 'fire');
        }

        // 🧹 画面の全クリア
        function clearCanvas() { points = []; sticks = []; particles = []; bullets = []; }

        // 📱 マウス・タッチ共通の位置取得
        function getEventPos(e) {
            let rect = canvas.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        // 👆 画面にタッチ（クリック）した瞬間
        function handleStart(e) {
            if (e.touches && e.touches.length > 1) return; // マルチタッチは無視
            let pos = getEventPos(e);
            
            // ナイフを掴んだかどうかの判定
            if (knife.active && pos.x > knife.x && pos.x < knife.x + knife.width && pos.y > knife.y && pos.y < knife.y + knife.height) {
                knife.isDragged = true;
                return;
            }

            // メロン人間を掴んだかどうかの判定
            for (let p of points) {
                let dx = p.x - pos.x; let dy = p.y - pos.y;
                if (Math.sqrt(dx*dx + dy*dy) < p.radius + 25) { // 触りやすいように判定広め
                    draggedPoint = p;
                    break;
                }
            }
        }

        // 🔄 タッチしたまま指を動かしている間
        function handleMove(e) {
            let pos = getEventPos(e);
            if (knife.isDragged) {
                knife.x = pos.x - knife.width / 2;
                knife.y = pos.y - knife.height / 2;
                return;
            }
            if (draggedPoint) {
                draggedPoint.x = pos.x; draggedPoint.y = pos.y;
                // 激しく引きずり回すと血が出る演出
                if (Math.random() < 0.2) spawnEffect(draggedPoint.x, draggedPoint.y, 1, 'blood');
            }
        }

        // ✋ 指を離した瞬間
        function handleEnd() { draggedPoint = null; knife.isDragged = false; }

        // PC用のマウスイベントを登録
        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('mouseup', handleEnd);
        // スマホ用のタッチイベントを登録
        canvas.addEventListener('touchstart', handleStart, { passive: true });
        canvas.addEventListener('touchmove', handleMove, { passive: true });
        canvas.addEventListener('touchend', handleEnd);
        // ⚔️ 武器・弾丸・炎の当たり判定と肉体への影響
        function physicsWeapons() {
            // 1. 🔪 ナイフの斬撃判定
            if (knife.active) {
                for (let p of points) {
                    if (p.x > knife.x && p.x < knife.x + knife.width && p.y > knife.y && p.y < knife.y + knife.height) {
                        p.hp -= 3; // 刻まれるとHP減少
                        spawnEffect(p.x, p.y, 2, 'blood'); // 大量出血
                    }
                }
            }

            // 2. 🔫 銃の弾丸の衝突判定
            for (let b = bullets.length - 1; b >= 0; b--) {
                let bullet = bullets[b];
                bullet.update();

                let hit = false;
                for (let p of points) {
                    let dx = p.x - bullet.x; let dy = p.y - bullet.y;
                    if (Math.sqrt(dx*dx + dy*dy) < p.radius + 6) {
                        p.hp -= 30; // 銃撃は致命傷！
                        p.x += 18;  // 弾丸の衝撃でのけぞる物理挙動
                        spawnEffect(p.x, p.y, 8, 'blood'); // 派手に飛び散る血
                        hit = true; break;
                    }
                }
                if (hit || bullet.x > canvas.width) bullets.splice(b, 1);
            }

            // 3. 🔥 放たれた炎の熱源判定
            for (let p of particles) {
                if (p.type === 'fire') {
                    for (let pt of points) {
                        let dx = pt.x - p.x; let dy = pt.y - p.y;
                        if (Math.sqrt(dx*dx + dy*dy) < pt.radius + 15) {
                            pt.onFire = true; // メロン人間に引火！！🔥
                        }
                    }
                }
            }
        }

        // 🎨 画面を1秒間に60回描き換えるメインループ
        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 物理・判定のアップデート
            for (let p of points) p.update();
            for (let i = 0; i < 5; i++) { for (let s of sticks) s.update(); }
            physicsWeapons();
            
            for (let p of particles) p.update();
            particles = particles.filter(p => p.life > 0);

            // 🦴 骨格（スティック）の描画
            ctx.strokeStyle = '#447744'; ctx.lineWidth = 6;
            for (let s of sticks) {
                ctx.beginPath(); ctx.moveTo(s.p0.x, s.p0.y); ctx.lineTo(s.p1.x, s.p1.y); ctx.stroke();
            }

            // 🧍 メロン人間の肉体パーツの描画
            for (let p of points) {
                // HPと黒焦げ度（burn）によってリアルタイムに色が激変するシステム！
                let red = Math.floor(((100 - p.hp) * 2.5) + (p.burn * 1.5));
                let green = Math.floor((p.hp * 2 + 50) * (1 - p.burn / 100));
                let blue = Math.floor(50 * (1 - p.burn / 100));
                
                // 完全に炭化（黒焦げ）したら真っ黒に
                if (red > 255) red = 255;
                if (green < 0) green = 0;
                ctx.fillStyle = `rgb(${red}, ${green}, ${blue})`;

                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
                
                // 顔パーツ（目）の描画
                if (p.type === 'head') {
                    ctx.fillStyle = '#000';
                    ctx.fillRect(p.x - 5, p.y - 3, 2, 4); ctx.fillRect(p.x + 3, p.y - 3, 2, 4);
                }
            }

            // ⚔️ 近接武器：ナイフの描画
            if (knife.active) {
                ctx.fillStyle = '#eee'; // 鋭い銀色の刃
                ctx.fillRect(knife.x, knife.y, knife.width - 20, knife.height);
                ctx.fillStyle = '#533'; // 木製の柄
                ctx.fillRect(knife.x + knife.width - 20, knife.y, 20, knife.height);
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
                ctx.strokeRect(knife.x, knife.y, knife.width, knife.height);
            }

            // 🔫 固定武器：アサルトライフルの描画
            ctx.fillStyle = '#333'; ctx.fillRect(gun.x, gun.y, gun.width, gun.height);
            ctx.fillStyle = '#111'; ctx.fillRect(gun.x + 10, gun.y + gun.height, 12, 15); // グリップ

            // 🔥 固定武器：火炎放射器の描画
            ctx.fillStyle = '#444'; ctx.fillRect(flamethrower.x, flamethrower.y, flamethrower.width, flamethrower.height);
            ctx.fillStyle = '#d41'; ctx.fillRect(flamethrower.x + 10, flamethrower.y + 5, 20, 15); // ガスタンク風

            // 弾丸とエフェクト粒子（血・炎・煙）の描画
            for (let b of bullets) b.draw();
            for (let p of particles) p.draw();

            requestAnimationFrame(loop);
        }

        // ゲーム開始時に1人スポーン＆ループ起動
        spawnRagdoll();
        loop();
    </script>
</body>
</html>
